name: ci_check_query_forms

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/scribe_data/wikidata/queries/**/*.sparql"
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - "src/scribe_data/wikidata/queries/**/*.sparql"

jobs:
  format_check:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        python-version:
          - "3.11"

    runs-on: ${{ matrix.os }}

    name: Run Check Query Forms

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0

      - name: Add project root to PYTHONPATH
        run: echo "PYTHONPATH=$(pwd)/src" >> $GITHUB_ENV

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run check_query_forms.py
        working-directory: ./src/scribe_data/check
        run: uv run python check_query_forms.py

      - name: Post-run status
        if: failure()
        run:
          echo "Project SPARQL query forms check failed. Please fix the reported
          errors."
